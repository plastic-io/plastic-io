name: CI/CD

on:
  push:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build
        run: |
          npm ci
          npm run build
      # docs must come first, tests write to a sub dir
      - name: Build docs
        run: npm run build-docs
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test
      - name: Publish Documentation
        uses: peaceiris/actions-gh-pages@v3
        continue-on-error: true
        with:
          deploy_key: ${{ secrets.ACTIONS_DEPLOY_KEY }}
          publish_dir: ./docs
# Publishing to npm moved to publish.yml (trusted publishing, staged).
