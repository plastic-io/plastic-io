name: CI/CD

# On every push to master: build, lint, test, publish the docs, then stage the
# package on npm through trusted publishing (OIDC).  npmjs.com is configured
# to trust this workflow file by name, so the publish job has to live here.
# A staged version goes live only after a maintainer approves it on npmjs.com
# (Staged Packages) with 2FA.
on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build
        run: |
          npm ci
          npm run build
      # docs must come first, tests write to a sub dir
      - name: Build docs
        run: npm run build-docs
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test
      - name: Publish Documentation
        uses: peaceiris/actions-gh-pages@v3
        continue-on-error: true
        with:
          deploy_key: ${{ secrets.ACTIONS_DEPLOY_KEY }}
          publish_dir: ./docs

  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          # no registry-url: setup-node would write an empty _authToken and
          # always-auth into .npmrc, and npm would use that instead of OIDC
      - name: Use an npm that knows staged publishing (11.15+)
        run: npm install -g npm@latest && npm --version
      - name: Build
        run: |
          npm ci
          npm run build
      - name: Skip when this version is already on npm
        id: check
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "already published: $NAME@$VERSION"; echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Show what trusted publishing will see
        run: |
          echo "repository: $GITHUB_REPOSITORY  workflow: $GITHUB_WORKFLOW_REF  ref: $GITHUB_REF"
          echo "OIDC token request url present: $([ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ] && echo yes || echo no)"
      - name: Stage on npm (awaits approval on npmjs.com)
        if: steps.check.outputs.publish == 'true'
        run: npm stage publish --access public
