name: Publish

# Stages @plastic-io/plastic-io on npm through trusted publishing (OIDC): no
# token lives in this repository.  A staged version goes live only after a
# maintainer approves it on npmjs.com (Staged Packages) with 2FA.
on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - name: Use an npm that knows staged publishing (11.15+)
        run: npm install -g npm@latest && npm --version
      - name: Build and test
        run: |
          npm ci
          npm run build
          npm run lint
          npm test
      - name: Skip when this version is already on npm
        id: check
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "already published: $NAME@$VERSION"; echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Stage on npm (awaits approval on npmjs.com)
        if: steps.check.outputs.publish == 'true'
        run: npm stage publish --access public
